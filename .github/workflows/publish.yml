name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # npm's trusted publisher for this package names this workflow file and this environment.
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing (OIDC, no token) and signing the SBOM attestation.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache in a release job: a cache written by another run could change what is published.
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later (docs.npmjs.com/trusted-publishers).
      - name: Require npm 11.5.1 or later
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error(`npm ${process.argv[1]} is older than 11.5.1`); process.exit(1); }
          ' "$(npm --version)"

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Smoke test
        run: node -e "const s = require('./dist/index.cjs'); console.log('OK:', typeof s.ScriftClient)"

      # One tarball: the SBOM is attested against it, and it is what npm receives.
      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP/release"

      - name: SBOM (CycloneDX)
        run: pnpm sbom --sbom-format cyclonedx --prod > "$RUNNER_TEMP/release/scrift-sdk.cdx.json"

      - name: Attest the SBOM against the tarball
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*.tgz
          sbom-path: ${{ runner.temp }}/release/scrift-sdk.cdx.json

      # npm, not pnpm, uploads the tarball: its trusted publisher and provenance work through this exact path.
      # Trusted publishing: npm exchanges the job's OIDC token, so no npm token exists, and it adds
      # provenance by itself for a public package published from a public repository.
      - name: Publish the attested tarball
        run: npm publish "$RUNNER_TEMP"/release/*.tgz --access public
