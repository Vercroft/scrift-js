name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  # The package's own checks, on every supported Node line (package.json "engines").
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false
      - name: Install (lockfile must be current)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run typecheck
      - name: Tests with the coverage floor
        run: pnpm run test:coverage
      - name: Build
        run: pnpm run build
      - name: Smoke test
        run: node -e "const s = require('./dist/index.cjs'); console.log('OK:', typeof s.ScriftClient)"

  # Every small check is a hook in .pre-commit-config.yaml; this job runs them all once.
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only runs the tools: pinned to a version every pinned package has a wheel for.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      # gitleaks scans staged changes, and CI has none; the Secret scan check scans the full history.
      - name: Run every hook
        env:
          SKIP: gitleaks
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r .github/requirements/pre-commit.txt -r .github/requirements/zizmor.txt
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          pre-commit run --all-files --hook-stage manual --show-diff-on-failure

  # The one CI check the ruleset requires. The matrix check names carry the Node version and change
  # with it; this name does not. `if: always()` so a failed job cannot skip it, and it fails unless
  # every job it needs passed or was skipped. tests/ci/gate-summary.test.ts fails when a job in this
  # file is missing from `needs` or has an `if:` it does not list.
  gate-summary:
    name: Gate summary
    if: always()
    needs: [node, repository-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every needed job to have passed or been skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'JS'
          const results = Object.entries(JSON.parse(process.env.NEEDS_JSON)).map(([job, need]) => [job, need.result]);
          for (const [job, result] of results.sort()) console.log(`${job}: ${result}`);
          const bad = results.filter(([, result]) => result !== 'success' && result !== 'skipped');
          if (results.length === 0 || bad.length > 0) {
            const list = bad.map(([job, result]) => `${job}=${result}`).join(', ') || 'no jobs';
            console.error(`not every needed job passed or was skipped: ${list}`);
            process.exit(1);
          }
          JS
