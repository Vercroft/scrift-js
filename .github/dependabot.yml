version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 3

  # npm, pnpm and yarn all use the "npm" ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7 # must match pnpm minimumReleaseAge (10080 minutes)
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    # Node's types follow the minimum Node line in package.json's engines; a new Node major is a
    # planned change, not a monthly update.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3

  # The hash-pinned CI tools (zizmor).
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 3
